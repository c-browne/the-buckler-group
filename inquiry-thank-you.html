<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inquiry Received | The Buckler Group</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#07111f;--gold:#b7904b;--white:#fff}
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:40px;
      background:
        radial-gradient(circle at 75% 25%,rgba(183,144,75,.14),transparent 30%),
        linear-gradient(135deg,#07111f,#0d1a2b);
      color:var(--white);
      font-family:"Inter",Arial,sans-serif;
    }
    .panel{max-width:820px;text-align:center}
    .eyebrow{
      color:var(--gold);
      text-transform:uppercase;
      letter-spacing:.2em;
      font-size:11px;
      font-weight:700;
      margin-bottom:20px;
    }
    h1{
      margin:0;
      font-family:"Cormorant Garamond",Georgia,serif;
      font-size:clamp(48px,7vw,86px);
      font-weight:600;
      line-height:.95;
      letter-spacing:-.045em;
    }
    p{
      max-width:650px;
      margin:28px auto 34px;
      color:rgba(255,255,255,.72);
      font-size:17px;
      line-height:1.7;
    }
    a{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:50px;
      padding:0 24px;
      background:var(--gold);
      border:1px solid var(--gold);
      color:var(--navy);
      text-decoration:none;
      text-transform:uppercase;
      letter-spacing:.13em;
      font-size:11px;
      font-weight:800;
    }
  </style>
</head>
<body>
  <main class="panel">
    <div class="eyebrow">The Buckler Group</div>
    <h1>Inquiry Received.</h1>
    <p>
      Thank you for contacting The Buckler Group. Your submission has been received for executive review.
      Where there is strategic alignment, our team will follow up regarding the appropriate next step.
    </p>
    <a href="/">Return to TBG</a>
  </main>
</body>
</html>
