name: Verify v4.5 after Netlify test relocation

on:
  push:
    paths:
      - '.github/workflows/verify-v45.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Confirm no test files are deployable functions
        run: |
          test ! -f netlify/functions/airtable.test.js
          test -f tests/airtable.test.js
          grep -q 'node --test tests/\*.test.js' package.json
