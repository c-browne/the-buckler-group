name: Build TBG institutional social card
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_tbg_social.py'
      - 'assets-images/tbg-logo-new.png'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/build_tbg_social.py
      - name: Commit image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets-images/tbg-institutional-social-v3.jpg
          git diff --cached --quiet || (git commit -m "Generate refined TBG institutional social card" && git push)
