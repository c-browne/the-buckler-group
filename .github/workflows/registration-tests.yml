name: Node registration tests
on:
  push:
    branches: [main, feature/tci-returning-registration-routing-20261008]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
